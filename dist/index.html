<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduFlow — Focused AI Study Planner</title>
    <meta name="description" content="EduFlow is a soft, approachable mobile-first study planner and exam prep companion with personalized pacing and AI research summaries." />
    
    <!-- Google Fonts: Inter (Sleek, Geometric, Modern Silicon Valley & Kaggle Standard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Meta Theme Color -->
    <meta name="theme-color" content="#F8F9FA" id="meta-theme-color" />

    <!-- Anti-Flash Dark Mode Script (Executes before React Mount) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('eduflow_v2_theme_mode') || 'system';
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored === 'dark' || (stored === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            const meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#13111C');
          } else {
            document.documentElement.classList.remove('dark');
            const meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#F8F9FA');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CB8kSiXh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DIwJXqiL.css">
  </head>

    <div id="root"></div>
  </body>
